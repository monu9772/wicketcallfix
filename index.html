<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wicket Call Fix - Official Telegram Channel</title>
    
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)n.push(n);n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    n.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    fbq('init', '899297616422553'); 
    fbq('track', 'PageView');

    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=899297616422553&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #030712;
            background-image: linear-gradient(135deg, #0f172a 0%, #090d16 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .main-box {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #38bdf8;
            border-radius: 25px;
            padding: 40px 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
        }

        .channel-title {
            font-size: 32px;
            font-weight: 900;
            color: #38bdf8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .channel-desc {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #38bdf8;
            font-weight: 600;
        }

        #timer {
            font-size: 18px;
            color: #22c55e;
            font-weight: bold;
        }

        .join-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            padding: 18px;
            border-radius: 15px;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .join-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 30px rgba(34, 197, 94, 0.6);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="main-box">
        <div class="channel-title">Wicket Call Fix</div>
        <p class="channel-desc">Join our official Telegram channel for accurate cricket calls and updates.</p>
        
        <div class="timer-box">
            Redirecting to Telegram in <span id="timer">10</span> seconds...
        </div>

        <!-- Button with Meta Contact Event Fix -->
        <a href="https://t.me/+muAqMZaJ2NFmZjJl" class="join-btn" onclick="trackContactEvent();">
            🚀 Join Telegram Now
        </a>

        <div class="footer-text">100% Free Access • Instant Updates</div>
    </div>

    <script>
        const telegramLink = "https://t.me/+muAqMZaJ2NFmZjJl";

        function trackContactEvent() {
            fbq('track', 'Contact', {
                currency: 'INR',
                value: 0.00
            });
        }

        // 10 Second Timer Logic
        let secondsLeft = 10;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            secondsLeft--;
            timerElement.textContent = secondsLeft;

            if (secondsLeft <= 0) {
                clearInterval(countdown);
                trackContactEvent();
                window.location.href = telegramLink;
            }
        }, 1000);
    </script>

</body>
</html>
